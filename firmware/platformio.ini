; Presence Card 固件 —— 权威 API 规范: ../docs/02-device-api-v1.md
; TODO(硬件): 按实际板型修改 board（CAMS3 Lite / CoreS3 SE / AtomS3 的 PlatformIO board id 不同）

[env:esp32-s3]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D FW_VERSION=\"0.1.0\"
    ; 编译期可配 base URL：dev/prod 两套构建目标 —— docs/00 §3
    -D PVC_API_BASE=\"https://api-dev.example.com/v1\"
