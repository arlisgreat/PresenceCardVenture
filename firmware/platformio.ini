; ============================================================
; M5Stack CoreS3 美颜相机 - PlatformIO 工程配置
; 框架: ESP-IDF v5.4  (espressif32 平台会按需下载工具链)
; ============================================================
[platformio]
; 源码目录: 本工程采用原生 ESP-IDF main/ 组件结构 (而非 PlatformIO 默认 src/)
src_dir = main

[env:cores3]
platform            = espressif32@^6.10.0
board               = m5stack-cores3
framework           = espidf
monitor_speed       = 115200
upload_speed        = 921600
; 16MB flash 自定义分区: 4MB app x3 (factory + OTA 双槽), 见 partitions_16mb.csv
board_build.partitions = partitions_16mb.csv
; esp-dl 人脸模型嵌入由 main/CMakeLists.txt 配置期生成 (单次构建通过)

; PSRAM 8MB 必须开启，摄像头帧缓冲与 LVGL 缓冲都在 PSRAM
board_build.arduino.memory_type = qio_qspi

build_flags =
    -D BOARD_HAS_PSRAM
    -O3
    -std=gnu17
    ; --- Presence Card 联网配置 (docs/02-device-api-v1.md) ---
    ; dev/prod 两套构建目标按 base URL 区分; WiFi 凭据仅供开发, 勿提交真实密码
    -D FW_VERSION=\"0.2.0\"
    -D PVC_API_BASE=\"https://api-dev.example.com/v1\"
    -D PVC_WIFI_SSID=\"\"
    -D PVC_WIFI_PASS=\"\"

; ESP-IDF sdkconfig 覆盖项
board_build.cmake_extra_args =
    -DESP_IDF_SDKCONFIG_OPTS=${PROJECT_DIR}/sdkconfig.defaults
