<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Presence 相框 · 动效演示 (800×480)</title>
<style>
/* ============================================================
   Presence Frame Motion Demo — 800×480
   设计规范来源: Presence小卡-屏幕UI与交互量化设计规范.md
   颜色 token 与动效曲线均取自规范 §1 / §4
   ============================================================ */
:root {
  /* 七色 token (规范 §1.1) */
  --grass-green:   #3E7A3A;
  --sky-blue:      #2F7DE0;
  --candy-pink:    #F7A8C8;
  --cream-yellow:  #F5D76E;
  --lilac-purple:  #C7B8EE;
  --paper-white:   #FDFBF5;
  --dark-night:    #1A1D1A;

  /* 动效曲线 (规范 §4) */
  --ease-flash-in: cubic-bezier(0.25, 1, 0.5, 1);   /* 新照片飘入 */
  --ease-out:      ease-out;                         /* 星星爆炸 / 淡出 */

  --mono: "Monaco", "Courier New", monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--dark-night);
}

/* ---------- 800×480 相框画布 ---------- */
#frame {
  position: relative;
  width: 800px; height: 480px;
  background: var(--paper-white);
  overflow: hidden;
  font-family: var(--mono);
  transform-origin: top left;
}

/* 窗口大于 800×480 时：居中 + 深色外框，方便录屏裁切 */
@media (min-width: 801px) and (min-height: 481px) {
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101210;
  }
  #frame {
    border-radius: 8px;
    box-shadow: 0 0 0 2px #000,
                0 0 0 10px #262926,
                0 30px 90px rgba(0, 0, 0, 0.65);
  }
}

/* ---------- 左上角标 ---------- */
#badge {
  position: absolute;
  top: 12px; left: 12px;
  z-index: 40;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(26, 29, 26, 0.55);
  border: 1px solid rgba(26, 29, 26, 0.28);
  border-radius: 3px;
  padding: 3px 7px;
  background: rgba(253, 251, 245, 0.8);
  user-select: none;
}

/* ---------- 待机态 ---------- */
#idle {
  position: absolute; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 1;
}
#idle .wait-text {
  font-size: 14px;
  color: rgba(26, 29, 26, 0.5);
  letter-spacing: 4px;
}
#idle .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--sky-blue);
  animation: pulse 1600ms ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.25; transform: scale(0.8); }
  50%      { opacity: 1;    transform: scale(1.15); }
}
/* 待机底部 grass_green 状态条(配对/系统主题色, 不进照片区) */
#idle .status-chip {
  position: absolute;
  bottom: 18px;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--paper-white);
  background: var(--grass-green);
  border-radius: 10px;
  padding: 4px 12px;
}

/* 待机态时间戳 (sky_blue, caption 级) */
#idle .idle-stamp {
  position: absolute;
  top: 14px; right: 16px;
  font-size: 12px;
  color: var(--sky-blue);
  letter-spacing: 1px;
}

/* ---------- 到达遮罩: dark_night 30% ---------- */
#dim {
  position: absolute; inset: 0;
  background: var(--dark-night);
  opacity: 0;
  transition: opacity 300ms linear;
  z-index: 10;
  pointer-events: none;
}
#dim.on { opacity: 0.3; }

/* ---------- 拍立得照片 ---------- */
#polaroid {
  position: absolute;
  left: 50%; top: 50%;
  width: 452px;
  padding: 16px 16px 52px 16px;          /* 白框, 底部留白写字 */
  background: var(--paper-white);
  box-shadow: 0 10px 34px rgba(26, 29, 26, 0.35),
              0 2px 6px  rgba(26, 29, 26, 0.2);
  transform: translate(-50%, -50%) scale(0.95);
  opacity: 0;
  z-index: 20;
  transition: opacity 500ms var(--ease-flash-in),
              transform 500ms var(--ease-flash-in);
}
#polaroid.in {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
#polaroid.out {
  transition: opacity 500ms var(--ease-out);
  opacity: 0;
}

/* 照片区 4:3 占位图 (CSS 渐变生成, 无外部图片) */
.photo {
  width: 420px; height: 315px;
  position: relative;
  overflow: hidden;
}
/* 场景一 · 阿岩: 海边日落 */
.scene-sunset {
  background:
    radial-gradient(circle at 68% 62%, #FFE9B0 0 26px, rgba(255,233,176,0) 27px),
    radial-gradient(circle at 68% 62%, rgba(255,200,120,0.55) 0 52px, rgba(255,200,120,0) 53px),
    linear-gradient(180deg,
      #F9C6D0 0%, #F7A8C8 30%,
      #F2B49A 48%, #E8956B 55%,
      #5E8CAA 56%, #3D6E94 78%, #2E5578 100%);
}
.scene-sunset::after { /* 海面反光 */
  content: "";
  position: absolute;
  left: 60%; top: 62%;
  width: 90px; height: 110px;
  background: linear-gradient(180deg, rgba(255,233,176,0.5), rgba(255,233,176,0));
  filter: blur(3px);
}
/* 场景二 · 小墨: 草地晴天 */
.scene-meadow {
  background:
    radial-gradient(circle at 22% 20%, #FFF3C4 0 22px, rgba(255,243,196,0) 23px),
    radial-gradient(ellipse 70px 22px at 62% 18%, rgba(255,255,255,0.85) 0 60%, rgba(255,255,255,0) 61%),
    radial-gradient(ellipse 90px 26px at 80% 28%, rgba(255,255,255,0.7) 0 60%, rgba(255,255,255,0) 61%),
    linear-gradient(180deg,
      #A8D4F0 0%, #C9E4F6 44%,
      #7FB069 45%, #5C9450 70%, #3E7A3A 100%);
}
/* 场景三 · Luna: 夜晚月亮 */
.scene-night {
  background:
    radial-gradient(circle at 74% 24%, #FDFBF5 0 20px, rgba(253,251,245,0) 21px),
    radial-gradient(circle at 74% 24%, rgba(245,215,110,0.35) 0 44px, rgba(245,215,110,0) 45px),
    radial-gradient(circle at 20% 30%, #F5D76E 0 1.5px, rgba(245,215,110,0) 2px),
    radial-gradient(circle at 38% 14%, #F5D76E 0 1.5px, rgba(245,215,110,0) 2px),
    radial-gradient(circle at 55% 34%, #FDFBF5 0 1.5px, rgba(253,251,245,0) 2px),
    radial-gradient(circle at 12% 58%, #FDFBF5 0 1.5px, rgba(253,251,245,0) 2px),
    radial-gradient(circle at 88% 52%, #F5D76E 0 1.5px, rgba(245,215,110,0) 2px),
    radial-gradient(circle at 46% 62%, #FDFBF5 0 1.5px, rgba(253,251,245,0) 2px),
    linear-gradient(180deg, #232A3D 0%, #2E3A55 62%, #3A4A6B 100%);
}
.scene-night::after { /* 远山剪影 */
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 70px;
  background:
    radial-gradient(ellipse 260px 70px at 20% 100%, #171C28 0 70%, rgba(0,0,0,0) 71%),
    radial-gradient(ellipse 320px 60px at 75% 100%, #10141D 0 70%, rgba(0,0,0,0) 71%);
}

/* 拍立得底部手写照旧文字 */
#polaroid .caption {
  position: absolute;
  left: 18px; bottom: 16px;
  font-size: 13px;
  color: rgba(26, 29, 26, 0.72);
  letter-spacing: 1px;
}
/* 照片右下角时间戳 (sky_blue) */
#polaroid .photo-stamp {
  position: absolute;
  right: 18px; bottom: 17px;
  font-size: 11px;
  color: var(--sky-blue);
}

/* ---------- 昵称贴纸 (lilac, -2°, 1px 白边, 2px 硬阴影) ---------- */
#sticker {
  position: absolute;
  left: -14px; bottom: 34px;
  z-index: 30;
  font-size: 14px;
  color: var(--dark-night);
  background: var(--lilac-purple);
  border: 1px solid #FFFFFF;
  border-radius: 4px;
  padding: 5px 12px;
  transform: rotate(-2deg);
  box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.15);
  transition: background-color 200ms ease-out;
  user-select: none;
}
#sticker.liked {
  background: var(--candy-pink);   /* 点赞高亮 */
}

/* ---------- 星星粒子 ---------- */
#star-layer {
  position: absolute;
  left: 50%; top: 50%;
  z-index: 35;
  pointer-events: none;
}
.star {
  position: absolute;
  left: 0; top: 0;
  background: var(--cream-yellow);
  filter: drop-shadow(0 0 2px rgba(245, 215, 110, 0.8));
  clip-path: polygon(50% 0%, 63% 35%, 98% 35%, 70% 57%, 81% 91%,
                     50% 70%, 19% 91%, 30% 57%, 2% 35%, 37% 35%);
  animation: starFly 1000ms var(--ease-out) forwards;
}
@keyframes starFly {
  0% {
    transform: translate(-50%, -50%) scale(0.8) rotate(0deg);
    opacity: 1;
  }
  100% {
    /* 规范 §4: TranslateY 0 → -40px, Scale 0.8 → 1.4, Opacity 1 → 0 */
    transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) - 40px))
               scale(1.4) rotate(var(--rot));
    opacity: 0;
  }
}
</style>
</head>
<body>
<div id="frame">
  <div id="badge">PRESENCE DEMO</div>

  <!-- 待机态 -->
  <div id="idle">
    <div class="idle-stamp" id="idle-stamp">--:--</div>
    <div class="dot"></div>
    <div class="wait-text">等待照片…</div>
    <div class="status-chip">PRESENCE FRAME · ONLINE · 已配对 3 人</div>
  </div>

  <!-- 到达遮罩 -->
  <div id="dim"></div>

  <!-- 拍立得照片 -->
  <div id="polaroid">
    <div class="photo" id="photo"></div>
    <div class="caption" id="caption"></div>
    <div class="photo-stamp" id="photo-stamp"></div>
    <div id="sticker"><span id="sticker-name"></span> · <span id="sticker-ago">刚刚</span></div>
  </div>

  <!-- 星星粒子层 -->
  <div id="star-layer"></div>
</div>

<script>
/* ============================================================
   剧本时序常量 —— 对应规范 §4 动效时间表
   移植 C++ 时只需照搬这一段数值
   ============================================================ */
const TIMING = {
  IDLE_HOLD:   2200,  // 待机停留时长 (ms)
  DIM_IN:      300,   // 到达遮罩淡入 (linear)
  PHOTO_IN:    500,   // 照片飘入: scale .95→1, opacity 0→1, cubic-bezier(0.25,1,0.5,1)
  DWELL:       4000,  // 停留展示
  STAR_BURST:  1000,  // 星星爆炸: ease-out, translateY -40px, scale .8→1.4, opacity→0
  STICKER_HI:  850,   // 贴纸 candy_pink 高亮持续
  PHOTO_OUT:   500,   // 淡出: ease-out, opacity 1→0
  DIM_OUT:     300    // 遮罩淡出
};

/* 演示数据组: 照片场景 + 昵称 + 配文 轮换 */
const GROUPS = [
  { name: "阿岩", scene: "scene-sunset", caption: "今天海边的日落 🌅", ago: "刚刚" },
  { name: "小墨", scene: "scene-meadow", caption: "天台晒被子的下午",   ago: "2m ago" },
  { name: "Luna", scene: "scene-night",  caption: "月亮很圆, 晚安 ✨",  ago: "5m ago" }
];

const STAR_COUNT = 10;  // 每次点赞爆发的星星数

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const dim = $("dim"), polaroid = $("polaroid"), photo = $("photo"),
      sticker = $("sticker"), starLayer = $("star-layer");

/* ---------- 实时时钟 (sky_blue 时间戳) ---------- */
function fmtTime(d) {
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function tickClock() {
  $("idle-stamp").textContent = fmtTime(new Date());
}
tickClock();
setInterval(tickClock, 1000);

/* ---------- 星星爆发 ---------- */
function spawnStars() {
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = 14 + Math.random() * 12;            // 14~26px
    s.style.width  = size + "px";
    s.style.height = size + "px";
    // 从照片中心向四周散开, 规范位移基准 translateY -40px, 再叠加随机散布
    const dx = (Math.random() - 0.5) * 220;          // ±110px 水平
    const dy = (Math.random() - 0.5) * 120;          // ±60px 垂直扰动
    s.style.setProperty("--dx",  dx.toFixed(1) + "px");
    s.style.setProperty("--dy",  dy.toFixed(1) + "px");
    s.style.setProperty("--rot", ((Math.random() - 0.5) * 120).toFixed(0) + "deg");
    s.style.animationDelay = (Math.random() * 180).toFixed(0) + "ms";
    starLayer.appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  }
}

/* ---------- 剧本状态机 ---------- */
let idx = 0;

function runCycle() {
  const g = GROUPS[idx % GROUPS.length];

  /* 阶段 1: 待机 IDLE_HOLD */
  setTimeout(() => arrive(g), TIMING.IDLE_HOLD);
}

function arrive(g) {
  /* 阶段 2: 画面微暗 + 照片飘入 */
  dim.classList.add("on");

  setTimeout(() => {
    // 装载本组数据
    photo.className = "photo " + g.scene;
    $("caption").textContent = g.caption;
    $("sticker-name").textContent = g.name;
    $("sticker-ago").textContent = g.ago;
    $("photo-stamp").textContent = fmtTime(new Date());

    polaroid.classList.remove("out");
    polaroid.classList.add("in");           // 500ms flash-in

    /* 阶段 3: 停留展示 DWELL */
    setTimeout(() => likeBurst(), TIMING.PHOTO_IN + TIMING.DWELL);
  }, TIMING.DIM_IN);
}

function likeBurst() {
  /* 阶段 4: 点赞爆发 */
  spawnStars();
  sticker.classList.add("liked");
  setTimeout(() => sticker.classList.remove("liked"), TIMING.STICKER_HI);

  /* 阶段 5: 淡出回归待机 */
  setTimeout(() => leave(), TIMING.STAR_BURST);
}

function leave() {
  polaroid.classList.remove("in");
  polaroid.classList.add("out");            // 500ms fade-out
  setTimeout(() => dim.classList.remove("on"), 150);

  setTimeout(() => {
    idx++;
    runCycle();                             // 循环下一组
  }, TIMING.PHOTO_OUT + TIMING.DIM_OUT);
}

runCycle();
</script>
</body>
</html>
