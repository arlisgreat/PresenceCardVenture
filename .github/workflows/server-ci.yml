name: server-ci
on:
  pull_request:
    paths: ['server/**']
  push:
    branches: [main, 'codex/**']
    paths: ['server/**']

jobs:
  effects-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server/effects } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/effects/package-lock.json
      - run: npm ci
      - run: npm test

  api-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/api/package-lock.json
      - run: npm ci --prefix ../effects
      - run: npm ci
      - name: API 测试
        run: npm test
      - name: Prisma schema 校验
        run: npx prisma validate
        env:
          # validate 只需要占位值，不连真实数据库
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/presence
      - run: npm run build

  web-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      # Web tests use the API's tsx loader; each job starts with a clean checkout.
      - run: npm ci --prefix ../effects
      - run: npm ci --prefix ../api
      - run: npm ci
      - name: Web API 契约测试
        run: npm test
      - run: npm run build
