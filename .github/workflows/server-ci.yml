name: server-ci
on:
  pull_request:
    paths: ['server/**']
  push:
    branches: [main]
    paths: ['server/**']

jobs:
  api-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/api/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm run build

  web-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
      - run: npm run build
