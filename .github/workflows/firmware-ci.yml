name: firmware-ci
on:
  pull_request:
    paths: ['firmware/**']
  push:
    branches: [main]
    paths: ['firmware/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install platformio
      - run: pio run
        working-directory: firmware
      # 硬件交付烧录说明与真机验收记录。
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: firmware/.pio/build/*/firmware.bin
          retention-days: 30

  # host 端算法压测: Linux 上 ASAN 可用 (macOS Apple clang ASAN 有环境性
  # dyld 卡死, 本地默认走 UBSAN; 真 ASAN 由本 job 每次 PR 兜底)
  host-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UBSAN + guard bands
        run: ./test/host/run_asan.sh
        working-directory: firmware
      - name: ASAN + UBSAN (20 万次 SOF 模糊)
        run: CFLAGS_EXTRA=-DFUZZ_ITERS=200000 ./test/host/run_asan.sh asan
        working-directory: firmware
      - name: TSAN 并发契约 (预览/worker 双线程)
        run: ./test/host/run_asan.sh tsan
        working-directory: firmware
