# Presence Card · ECS 部署（docs/01 §2）
# 首次部署：cp .env.example .env 填值 → docker compose up -d →
#           docker compose exec api npx prisma migrate deploy
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv/web:ro   # web 构建产物（CI 或手动 npm run build）
      - caddy_data:/data
    depends_on: [api]

  api:
    build: ../api
    restart: always
    env_file: .env                # DATABASE_URL 指向 db:5432
    depends_on: [db]

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: presence
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  caddy_data:
  pgdata:
